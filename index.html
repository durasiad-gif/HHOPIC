<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPIc AL 연습</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f8cff;
    --text: #e8e8ea;
    --muted: #b7bcc6;
    --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  h1 {
    font-size: 26px;
    margin: 4px 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin: 30px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .q {
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
  }
  .q .arrow {
    color: var(--accent);
    transition: transform 0.2s ease;
    flex-shrink: 0;
    font-size: 14px;
  }
  .card.open .arrow { transform: rotate(90deg); }
  .a {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 18px;
    font-size: 18px;
    color: var(--muted);
  }
  .card.open .a {
    max-height: 4000px;
    padding: 0 18px 18px;
  }
  .a p {
    margin: 0 0 10px;
    line-height: 2.2;
  }
  .a strong {
    color: #ffd479;
    font-weight: 700;
  }
  .tag {
    display: inline-block;
    font-size: 15px;
    color: var(--accent);
    background: rgba(79,140,255,0.12);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .mk { background: var(--card, #1b1f27); border-radius: 12px; padding: 12px 14px; margin: 8px 0; border-left: 4px solid #f0a35e; }
  .mk.hot { border-left-color: #e5534b; }
  .mk .mtop { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; opacity: .75; margin-bottom: 6px; }
  .mk .wrong { text-decoration: line-through; opacity: .6; }
  .mk .right { font-weight: 700; margin: 4px 0; }
  .mk .why { font-size: 13px; opacity: .85; }
  .mk .sp { cursor: pointer; margin-right: 6px; }
  .expr {
    font-size: 16px;
    line-height: 1.6;
    color: #8fd19e;
    margin-top: 8px;
  }
  .filter-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 8px 0 12px;
    z-index: 10;
  }
  .filter-bar select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 18px;
  }
  .hidden { display: none; }
  .ctrl { display: flex; gap: 8px; margin-top: 8px; }
  .ctrl button, .card-play {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }
  .ctrl button { flex: 1; }
  .ctrl button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card-play { margin: 4px 6px 10px 0; color: var(--accent); }
  .sec-ctrl { display: flex; gap: 6px; margin: 2px 0 8px; }
  .sec-ctrl button { flex: 1; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 13px; cursor: pointer; }
  .loopinfo { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; display: none; z-index: 50; }
  .loopinfo.on { display: block; }
  .sp { cursor: pointer; color: var(--accent); margin-right: 8px; font-size: 16px; }
  .a p.speaking { background: rgba(79,140,255,0.18); border-radius: 6px; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; }
  .tabs button { flex: 1; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 17px; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pane { display: none; }
  .pane.on { display: block; }
  .group-title { font-size: 22px; font-weight: 800; margin: 34px 0 4px; }
  .group-desc { color: var(--muted); font-size: 15px; margin-bottom: 4px; }
  .todo { background: transparent; border: 1px dashed var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; font-size: 16px; color: var(--muted); }
  .todo b { color: #f0a35e; font-weight: 600; margin-right: 6px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .modes button, .pbtn { padding: 14px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; cursor: pointer; }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  .gsel { width: 100%; padding: 12px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 16px; margin-bottom: 14px; }
  .qbox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 18px; min-height: 180px; }
  .qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .qtext { font-size: 20px; line-height: 1.6; font-weight: 600; }
  .qtext.blur { filter: blur(7px); user-select: none; }
  .timer { font-size: 54px; font-weight: 800; text-align: center; margin: 18px 0 8px; font-variant-numeric: tabular-nums; }
  .timer.over { color: #ff7a7a; }
  .prow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .pbtn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; font-size: 16px; }
  .box h3 { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
  .box ul { margin: 0; padding-left: 20px; }
  .box li { margin-bottom: 6px; }
  .phase { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .phase:last-child { border-bottom: 0; }
  .phase small { color: var(--muted); display: block; }
  .badge { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: rgba(79,140,255,0.15); color: var(--accent); white-space: nowrap; align-self: center; }
</style>
</head>
<body>

<h1>OPIc AL — 호바리</h1>
<div class="sub" id="subline"></div>

<div class="tabs">
  <button id="t-cards" class="on" onclick="tab('cards')">카드</button>
  <button id="t-practice" onclick="tab('practice')">실전 연습</button>
  <button id="t-mistakes" onclick="tab('mistakes')">실수 노트</button>
  <button id="t-progress" onclick="tab('progress')">진도</button>
</div>

<!-- 카드 -->
<div class="pane on" id="p-cards">
  <div class="filter-bar">
    <select id="filter" onchange="filterGroups()"><option value="all">전체 보기</option></select>
    <div class="ctrl">
      <button onclick="playAll()">▶ 전체 재생</button>
      <button onclick="stopAll()">■ 정지</button>
      <button id="r08" onclick="setRate(0.8)">0.8x</button>
      <button id="r10" class="on" onclick="setRate(1)">1x</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- 실전 연습 -->
<div class="pane" id="p-practice">
  <div class="modes">
    <button id="m-single" class="on" onclick="setMode('single')">한 문제</button>
    <button id="m-combo" onclick="setMode('combo')">콤보 3연타</button>
    <button id="m-exam" onclick="setMode('exam')">실전 15문항</button>
  </div>
  <select class="gsel" id="gsel"></select>
  <div class="qbox">
    <div class="qmeta"><span id="qinfo">시작을 누르세요</span><span id="qcount"></span></div>
    <div class="qtext" id="qtext">질문이 여기에 나와요. 실제 시험처럼 먼저 듣고, 필요하면 글자를 보세요.</div>
  </div>
  <div class="timer" id="timer">2:00</div>
  <div class="prow">
    <button class="pbtn main" id="startBtn" onclick="startPractice()">시작</button>
    <button class="pbtn" onclick="nextQ()">다음 문제 ▶</button>
    <button class="pbtn" id="replayBtn" onclick="replayQ()">질문 다시 듣기 (1회)</button>
    <button class="pbtn" onclick="toggleText()">글자 보기/숨기기</button>
  </div>
  <div class="hint">질문은 시험처럼 최대 2번만 들을 수 있어요. 2분이 지나면 타이머가 빨갛게 바뀌어요(계속 말해도 돼요). 휴대폰으로 녹음하면서 답하고, 다 끝나면 진도 탭의 셀프 채점으로 확인하세요.<br>연습 문항은 직접 만든 것이라 실제 기출 문장과 다를 수 있어요.</div>
</div>

<!-- 실수 노트 -->
<div class="pane" id="p-mistakes">
  <div class="filter-bar">
    <select id="mfilter" onchange="renderMistakes()">
      <option value="all">전체</option><option value="hot">자주 나온 것 (2번 이상)</option>
      <option value="시제">시제</option><option value="문법">문법</option><option value="표현">표현</option>
      <option value="발음">발음</option><option value="막힘">막힘</option>
    </select>
  </div>
  <div id="mistakeBox"></div>
</div>

<!-- 진도 -->
<div class="pane" id="p-progress"><div id="progressBox"></div></div>

<div class="loopinfo" id="loopinfo" onclick="stopAll()"></div>
<script src="cards.js"></script>
<script src="bank.js"></script>
<script src="progress.js"></script>
<script src="mistakes.js"></script>
<script>
const GROUPS = [
  { id: "intro",   name: "자기소개",          desc: "채점 안 함. 짧고 깔끔하게" },
  { id: "park",    name: "공원",              desc: "공원 · 걷기 · 조깅" },
  { id: "travel",  name: "여행",              desc: "캠핑 · 차로 드라이브 · 집 휴가 · 국내 여행 · 해외여행" },
  { id: "gym",     name: "운동 시설",         desc: "수영 · 헬스" },
  { id: "culture", name: "문화",              desc: "영화 · 음악 감상" },
  { id: "random",  name: "돌발",              desc: "서베이와 상관없이 2세트 정도 나옴" },
  { id: "rp",      name: "롤플레이 (11~13)",  desc: "질문하기 → 대안 제시 → 관련 경험" },
  { id: "adv",     name: "어드밴스 (14~15)",  desc: "비교·설명 → 이슈·의견" },
];
const gName = id => (GROUPS.find(g => g.id === id) || {}).name || id;

document.getElementById('subline').textContent =
  `목표 ${progress.goal} · 업데이트 ${progress.updated}`;

function tab(id) {
  ['cards','practice','mistakes','progress'].forEach(t => {
    document.getElementById('t-' + t).classList.toggle('on', t === id);
    document.getElementById('p-' + t).classList.toggle('on', t === id);
  });
  stopAll();
}

/* ---------- 카드 ---------- */
const container = document.getElementById('content');
const filterSelect = document.getElementById('filter');

GROUPS.forEach(g => {
  const opt = document.createElement('option');
  opt.value = g.id; opt.textContent = g.name;
  filterSelect.appendChild(opt);

  const wrap = document.createElement('div');
  wrap.className = 'group'; wrap.dataset.group = g.id;
  wrap.innerHTML = `<div class="group-title">${g.name}</div><div class="group-desc">${g.desc}</div>`;
  container.appendChild(wrap);

  const secs = cards.filter(s => s.group === g.id);
  secs.forEach(sec => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = sec.section;
    wrap.appendChild(title);
    const made = sec.cards.map((c, ci) => makeCard(c, ci));
    if (made.length > 1) {
      const sc = document.createElement('div');
      sc.className = 'sec-ctrl';
      sc.innerHTML = `<button>▶ 콤보 전체 재생</button><button>🔁 콤보 반복</button>`;
      const all = () => { made.forEach(c => c.classList.add('open')); return made.flatMap(c => c._items); };
      sc.children[0].onclick = () => playList(all(), false, sec.section);
      sc.children[1].onclick = () => playList(all(), true, sec.section);
      wrap.appendChild(sc);
    }
    made.forEach(c => wrap.appendChild(c));
  });

  // 아직 모범답안이 없는 연습 문항 = 앞으로 채울 자리
  const answered = new Set(secs.flatMap(s => s.cards.map(c => c.q)));
  const todos = bank.filter(b => b.g === g.id && !answered.has(b.q));
  if (todos.length) {
    const t = document.createElement('div');
    t.className = 'section-title';
    t.style.color = '#f0a35e';
    t.textContent = `준비할 질문 ${todos.length}개`;
    wrap.appendChild(t);
    todos.forEach(b => {
      const d = document.createElement('div');
      d.className = 'todo';
      d.innerHTML = `<b>${b.item} · ${b.t}</b>${b.q}`;
      wrap.appendChild(d);
    });
  }
});

function makeCard(c, ci) {
  const card = document.createElement('div');
  card.className = 'card';
  const parts = c.a.split(/(?<=[.?!])\s+(?=[A-Z가-힣])/);
  const sentences = parts.map(s => '<p><span class="sp">▶</span>' + s.trim() + '</p>').join('');
  card.innerHTML = `
    <div class="q" onclick="this.parentElement.classList.toggle('open')">
      <span>${ci + 1}. ${c.q}</span><span class="arrow">▶</span>
    </div>
    <div class="a">
      <button class="card-play">▶ 재생</button><button class="card-play card-loop">🔁 이 문제 반복</button>
      ${sentences}
      ${c.expr ? '<div class="expr">' + c.expr + '</div>' : ''}
    </div>`;
  const pEls = Array.from(card.querySelectorAll('.a p'));
  const qItem = { el: card.querySelector('.q'), text: speakText(c.q), pauseAfter: 1500 };
  const items = [qItem, ...pEls.map((el, i) => ({ el, text: speakText(parts[i]) })).filter(x => x.text)];
  card._items = items;
  card.querySelector('.card-play').onclick = () => { card.classList.add('open'); playList(items, false, (ci + 1) + '번 문제'); };
  card.querySelector('.card-loop').onclick = () => { card.classList.add('open'); playList(items, true, (ci + 1) + '번 문제'); };
  items.forEach(it => { const sp = it.el.querySelector('.sp'); if (sp) sp.onclick = (e) => { e.stopPropagation(); playList([it]); }; });
  return card;
}

function filterGroups() {
  const val = filterSelect.value;
  document.querySelectorAll('.group').forEach(g =>
    g.classList.toggle('hidden', val !== 'all' && g.dataset.group !== val));
}

/* ---------- 읽어주기 ---------- */
let rate = 1, token = 0;
function speakText(html) {
  const d = document.createElement('div');
  d.innerHTML = html.replace(/<br\s*\/?>/g, '\n');
  return d.textContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('흐름')).join(' ').trim();
}
function setRate(r) {
  rate = r;
  document.getElementById('r08').classList.toggle('on', r === 0.8);
  document.getElementById('r10').classList.toggle('on', r === 1);
}
function clearHl() { document.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking')); }
function stopAll() { token++; try { speechSynthesis.cancel(); } catch (e) {} clearHl(); showLoop(''); }
function showLoop(label) {
  const b = document.getElementById('loopinfo');
  if (!b) return;
  b.textContent = label ? `🔁 ${label} 반복 중 · 눌러서 정지` : '';
  b.classList.toggle('on', !!label);
}
function say(text, onend) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  u.onend = onend; u.onerror = onend;
  speechSynthesis.speak(u);
}
function playList(items, loop = false, label = '') {
  stopAll();
  if (loop) showLoop(label || '선택');
  const my = token; let i = 0;
  const next = () => {
    if (my !== token) return;
    if (i >= items.length) {
      if (!loop) { clearHl(); return; }
      i = 0; clearHl();
      return setTimeout(next, 2500);   // 한 바퀴 끝나면 2.5초 쉬고 다시
    }
    const it = items[i++];
    clearHl(); it.el.classList.add('speaking');
    it.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    say(it.text, () => { if (my === token) setTimeout(next, it.pauseAfter || 0); });
  };
  next();
}
function playAll() {
  const all = [];
  document.querySelectorAll('.group:not(.hidden) .card').forEach(c => { c.classList.add('open'); all.push(...c._items); });
  playList(all);
}

/* ---------- 실전 연습 ---------- */
let mode = 'single', queue = [], qi = -1, plays = 0, showText = false, tick = null, sec = 0;
const gsel = document.getElementById('gsel');
function fillGsel() {
  gsel.innerHTML = '';
  const opts = mode === 'exam' ? [['all', '전체에서 무작위']] :
    [['all', '전체에서 무작위'], ['survey', '서베이 주제만'], ...GROUPS.filter(g => g.id !== 'intro').map(g => [g.id, g.name])];
  opts.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; gsel.appendChild(o); });
  gsel.disabled = mode === 'exam';
}
function setMode(m) {
  mode = m;
  ['single','combo','exam'].forEach(x => document.getElementById('m-' + x).classList.toggle('on', x === m));
  fillGsel(); resetPractice();
}
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const SURVEY = ['travel','gym','park','culture'];
function pool(sel) {
  if (sel === 'all') return bank;
  if (sel === 'survey') return bank.filter(b => SURVEY.includes(b.g));
  return bank.filter(b => b.g === sel);
}
// 같은 주제 3문제: 묘사 → 루틴/비교 → 과거경험
function comboFor(items) {
  const byT = t => items.filter(b => b.t === t);
  const first = rnd(byT('묘사').length ? byT('묘사') : items);
  const mids = items.filter(b => b !== first && (b.t === '루틴' || b.t === '비교'));
  const second = mids.length ? rnd(mids) : rnd(items.filter(b => b !== first));
  const lasts = items.filter(b => b !== first && b !== second && b.t === '과거경험');
  const third = lasts.length ? rnd(lasts) : rnd(items.filter(b => b !== first && b !== second));
  return [first, second, third].filter(Boolean);
}
function topicCombo(g) {
  const src = g === 'any' ? bank.filter(b => !b.set) : bank.filter(b => b.g === g);
  const byItem = {};
  src.forEach(b => (byItem[b.item] = byItem[b.item] || []).push(b));
  const ok = Object.values(byItem).filter(a => a.length >= 3);
  if (ok.length) return comboFor(rnd(ok));
  // 돌발처럼 주제당 문항이 적으면 같은 그룹에서 3문제
  return comboFor(shuffle(src).slice(0, 6));
}
function setCombo(g) {
  const sets = [...new Set(bank.filter(b => b.g === g).map(b => b.set))];
  const s = rnd(sets);
  return bank.filter(b => b.set === s);
}
function buildQueue() {
  const sel = gsel.value;
  if (mode === 'single') return [rnd(pool(sel))];
  if (mode === 'combo') {
    if (sel === 'rp' || sel === 'adv') return setCombo(sel);
    if (sel === 'all' || sel === 'survey') {
      const g = sel === 'survey' ? rnd(SURVEY) : rnd([...SURVEY, 'random']);
      return topicCombo(g);
    }
    return topicCombo(sel);
  }
  // 실전 15문항: 자기소개 + 서베이 2세트 + 돌발 1세트 + 롤플 + 어드밴스
  const intro = { g: 'intro', item: '자기소개', t: '자기소개', q: 'Let\'s start the interview now. Tell me a little bit about yourself.' };
  const sv = shuffle(SURVEY).slice(0, 2);
  const parts = shuffle([topicCombo(sv[0]), topicCombo(sv[1]), topicCombo('random')]);
  return [intro, ...parts.flat(), ...setCombo('rp'), ...setCombo('adv')];
}
function resetPractice() {
  stopTimer(); stopAll(); queue = []; qi = -1;
  document.getElementById('qinfo').textContent = '시작을 누르세요';
  document.getElementById('qcount').textContent = '';
  document.getElementById('qtext').textContent = '질문이 여기에 나와요. 실제 시험처럼 먼저 듣고, 필요하면 글자를 보세요.';
  document.getElementById('qtext').classList.remove('blur');
  document.getElementById('timer').textContent = '2:00';
  document.getElementById('timer').classList.remove('over');
  document.getElementById('startBtn').textContent = '시작';
}
function startPractice() { queue = buildQueue(); qi = -1; document.getElementById('startBtn').textContent = '새로 시작'; nextQ(); }
function nextQ() {
  if (!queue.length) return startPractice();
  qi++;
  if (qi >= queue.length) {
    stopTimer(); stopAll();
    document.getElementById('qinfo').textContent = '끝!';
    document.getElementById('qtext').classList.remove('blur');
    document.getElementById('qtext').textContent = '수고했어요. 녹음 다시 들으면서 진도 탭의 셀프 채점으로 확인하고, 막힌 질문은 Claude한테 가져가세요.';
    return;
  }
  const b = queue[qi];
  document.getElementById('qinfo').textContent = `${gName(b.g)} · ${b.item} · ${b.t}`;
  document.getElementById('qcount').textContent = `${qi + 1} / ${queue.length}`;
  const qt = document.getElementById('qtext');
  qt.textContent = b.q; qt.classList.toggle('blur', !showText);
  plays = 0; document.getElementById('replayBtn').disabled = false;
  stopTimer(); document.getElementById('timer').textContent = '2:00'; document.getElementById('timer').classList.remove('over');
  speakQ(true);
}
function speakQ(first) {
  stopAll(); plays++;
  if (plays >= 2) document.getElementById('replayBtn').disabled = true;
  const my = token;
  say(queue[qi].q, () => { if (my === token && first) startTimer(); });
  if (first && !('speechSynthesis' in window)) startTimer();
}
function replayQ() { if (qi < 0 || qi >= queue.length || plays >= 2) return; stopTimer(); speakQ(false); startTimer(); }
function toggleText() { showText = !showText; document.getElementById('qtext').classList.toggle('blur', !showText && qi >= 0 && qi < queue.length); }
function startTimer() {
  stopTimer(); sec = 0;
  const el = document.getElementById('timer');
  tick = setInterval(() => {
    sec++;
    const left = 120 - sec, a = Math.abs(left);
    el.textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
    el.classList.toggle('over', left < 0);
  }, 1000);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }
fillGsel();

/* ---------- 실수 노트 ---------- */
function renderMistakes() {
  const f = document.getElementById('mfilter').value;
  let list = mistakes.slice();
  if (f === 'hot') list = list.filter(m => m.cnt >= 2);
  else if (f !== 'all') list = list.filter(m => m.type === f);
  list.sort((a, b) => b.cnt - a.cnt);
  const hot = mistakes.filter(m => m.cnt >= 2).length;
  document.getElementById('mistakeBox').innerHTML =
    `<div class="hint">빨간 줄 = 2번 이상 나온 실수 (${hot}개). 시험 전까지 이것부터 없애기. ▶ 누르면 맞는 문장 읽어줘요.</div>` +
    list.map((m, i) => `
      <div class="mk ${m.cnt >= 2 ? 'hot' : ''}">
        <div class="mtop"><span>${m.type} · ${m.topic}</span><span>${m.date} · ${m.cnt}회</span></div>
        <div class="wrong">✗ ${m.wrong}</div>
        <div class="right"><span class="sp" data-t="${encodeURIComponent(m.right)}">▶</span>○ ${m.right}</div>
        <div class="why">${m.why}</div>
      </div>`).join('');
  document.querySelectorAll('#mistakeBox .sp').forEach(el => el.onclick = () => {
    const t = decodeURIComponent(el.dataset.t).replace(/\(.*?\)|—.*$/g, '');
    playList([{ el: el.parentElement, text: speakText(t) }]);
  });
}
renderMistakes();

/* ---------- 진도 ---------- */
(function renderProgress() {
  const p = progress;
  const doneQs = new Set(cards.flatMap(s => s.cards.map(c => c.q)));
  const cover = GROUPS.filter(g => g.id !== 'intro').map(g => {
    const n = cards.filter(s => s.group === g.id).reduce((a, s) => a + s.cards.length, 0);
    const todo = bank.filter(b => b.g === g.id && !doneQs.has(b.q)).length;
    return `<div class="phase"><div>${g.name}<small>모범답안 ${n}개 · 준비할 질문 ${todo}개</small></div></div>`;
  }).join('');
  document.getElementById('progressBox').innerHTML = `
    <div class="box"><h3>일정</h3>${p.phases.map(ph =>
      `<div class="phase"><div>${ph.name} <small>${ph.range} · ${ph.focus}</small></div>${ph.status ? `<span class="badge">${ph.status}</span>` : ''}</div>`).join('')}</div>
    <div class="box"><h3>지금 약점</h3><ul>${p.weak.map(w => `<li>${w}</li>`).join('')}</ul></div>
    <div class="box"><h3>덩어리별 준비 현황</h3>${cover}</div>
    <div class="box"><h3>서베이</h3>${p.survey}</div>
    <div class="box"><h3>셀프 채점 (녹음 듣고)</h3><ul>
      <li>목소리: 끝이 흐려지지 않나, 크고 자신 있나</li>
      <li>억양: 강세 살렸나, <b>외운 걸 떠올리는 티</b> 안 나나</li>
      <li>내용: 3초 이상 멈춤 없나, 같은 말 다르게 했나, 서론-본론-결론</li>
      <li>문법: 미완성 문장 없나, <b>과거·현재 시제</b> 맞나</li>
      <li>발음: 휴대폰 음성 입력에 말해서 제대로 받아 적히나</li></ul></div>
    <div class="box"><h3>기록</h3><ul>${p.log.slice().reverse().map(l => `<li>${l.date} — ${l.note}</li>`).join('')}</ul></div>`;
})();
</script>
